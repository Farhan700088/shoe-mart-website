<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOE MART</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="top-header" onclick="goHome()">
    <img src="Shoe%20Mart/shoemartlogo.png" alt="SHOE MART LOGO" class="brand-logo">
    <h1 class="brand-name">SHOE MART</h1>
  </header>

  <!-- PAGE 01: Categories -->
  <main id="page1" class="page active">
    <div class="category-row">
      <!-- Section 1: Special Offer -->
      <div class="category-card" onclick="openCategory('bestOffer', true)">
        <div class="category-box">
          <img src="Shoe%20Mart/Bestoffer.jpg" alt="SPECIAL OFFER">
        </div>
        <p class="category-label">SPECIAL OFFER</p>
      </div>

      <!-- Section 2: Polo Shoe -->
      <div class="category-card" onclick="openCategory('poloShoe', true)">
        <div class="category-box">
          <img src="Shoe%20Mart/polologo.jpg" alt="POLO SHOE">
        </div>
        <p class="category-label">POLO SHOE</p>
      </div>
    </div>
  </main>

  <!-- PAGE 02: Shoe Grid -->
  <main id="page2" class="page">
    <div class="page2-top">
      <h2 id="categoryTitle" class="section-title"></h2>
    </div>
    <div id="shoeGrid" class="shoe-grid"></div>
  </main>

  <!-- PAGE 03: Shoe Details & Smooth Slider -->
  <main id="page3" class="page">
    <div id="sliderContainer" class="slider-container">
      <div id="sliderTrack" class="slider-track"></div>
    </div>
    <div id="sliderDots" class="slider-dots"></div>

    <div class="details-box">
      <h2 id="detailShoeName" class="shoe-title">SHOENAME</h2>
      <p id="detailShoePrice" class="shoe-price">₹1999/-</p>
      <a id="whatsappBtn" href="#" target="_blank" class="whatsapp-btn">ORDER ON WHATSAPP</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
